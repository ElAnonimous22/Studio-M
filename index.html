<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio M | Catálogo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado -->
  <header>
    <div class="logo" onclick="mostrarCatalogo()">STUDIO <span>M</span></div>
  </header>

  <main class="container">
    <!-- Vista 1: Catálogo principal (Grid) -->
    <section id="catalogo-view">
      <h1 class="titulo-seccion">Catálogo de Productos</h1>
      <div id="grid-productos" class="grid-productos"></div>
    </section>

    <!-- Vista 2: Detalle del Producto (Oculta por defecto) -->
    <section id="detalle-view" class="hidden">
      <button class="btn-volver" onclick="mostrarCatalogo()">← Volver al catálogo</button>
      <div id="detalle-contenido" class="detalle-container"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
